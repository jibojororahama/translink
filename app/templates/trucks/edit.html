{% extends "base.html" %}

{% block title %}Edit Truck - TransLink{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="mb-4">

        <a href="{{ url_for('trucks.my_trucks') }}"
           class="text-decoration-none text-muted">

            <i class="bi bi-arrow-left me-1"></i>
            Back to My Trucks

        </a>

        <h2 class="fw-bold mt-3 mb-1">
            Edit Truck
        </h2>

        <p class="text-muted">
            Update your truck information and availability.
        </p>

    </div>


    <div class="row justify-content-center">

        <div class="col-lg-9">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-4 p-md-5">

                    <form method="POST">

                        <div class="row g-4">

                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Truck Name
                                </label>

                                <input
                                    type="text"
                                    name="truck_name"
                                    class="form-control"
                                    value="{{ truck.truck_name }}"
                                    required
                                >

                            </div>


                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Registration Number
                                </label>

                                <input
                                    type="text"
                                    name="registration_number"
                                    class="form-control"
                                    value="{{ truck.registration_number }}"
                                    required
                                >

                            </div>


                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Truck Type
                                </label>

                                <select
                                    name="truck_type"
                                    class="form-select"
                                    required
                                >

                                    {% for type in [
                                        "Flatbed",
                                        "Box Truck",
                                        "Tipper",
                                        "Tanker",
                                        "Refrigerated Truck",
                                        "Trailer",
                                        "Cargo Truck",
                                        "Other"
                                    ] %}

                                    <option
                                        value="{{ type }}"
                                        {% if truck.truck_type == type %}selected{% endif %}
                                    >
                                        {{ type }}
                                    </option>

                                    {% endfor %}

                                </select>

                            </div>


                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Capacity
                                </label>

                                <div class="input-group">

                                    <input
                                        type="number"
                                        name="capacity"
                                        class="form-control"
                                        min="0.1"
                                        step="0.1"
                                        value="{{ truck.capacity }}"
                                        required
                                    >

                                    <select
                                        name="capacity_unit"
                                        class="form-select"
                                    >

                                        <option
                                            value="tons"
                                            {% if truck.capacity_unit == "tons" %}selected{% endif %}
                                        >
                                            Tons
                                        </option>

                                        <option
                                            value="kg"
                                            {% if truck.capacity_unit == "kg" %}selected{% endif %}
                                        >
                                            KG
                                        </option>

                                    </select>

                                </div>

                            </div>


                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Current Location
                                </label>

                                <input
                                    type="text"
                                    name="current_location"
                                    class="form-control"
                                    value="{{ truck.current_location }}"
                                    required
                                >

                            </div>


                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Preferred Destination
                                </label>

                                <input
                                    type="text"
                                    name="destination_area"
                                    class="form-control"
                                    value="{{ truck.destination_area or '' }}"
                                >

                            </div>


                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Availability
                                </label>

                                <select
                                    name="availability"
                                    class="form-select"
                                >

                                    {% for status in [
                                        "Available",
                                        "Booked",
                                        "Unavailable",
                                        "Maintenance"
                                    ] %}

                                    <option
                                        value="{{ status }}"
                                        {% if truck.availability == status %}selected{% endif %}
                                    >
                                        {{ status }}
                                    </option>

                                    {% endfor %}

                                </select>

                            </div>


                            <div class="col-12">

                                <label class="form-label fw-semibold">
                                    Description
                                </label>

                                <textarea
                                    name="description"
                                    class="form-control"
                                    rows="4"
                                >{{ truck.description or '' }}</textarea>

                            </div>

                        </div>


                        <hr class="my-5">


                        <div class="d-flex gap-3">

                            <a
                                href="{{ url_for('trucks.my_trucks') }}"
                                class="btn btn-light border px-4"
                            >
                                Cancel
                            </a>

                            <button
                                type="submit"
                                class="btn btn-warning fw-semibold px-4"
                            >
                                <i class="bi bi-save me-2"></i>
                                Save Changes
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
